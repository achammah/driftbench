# The phrase bank of the Northwind fixture estate, written by hand as a stand-in for the approved phrases the
# real flow would produce (a model proposes, a person approves). Each situation names the atoms it sets off,
# what it is for (use), the workspace it starts from and the paths the ask may touch: every other path must
# stay untouched. Northwind Traders, its suppliers, orders and shipments are invented. Fictional data only.
