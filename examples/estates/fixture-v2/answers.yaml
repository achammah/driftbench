# Version 2 of the Northwind fixture: the answers of examples/estates/fixture/answers.yaml with the changes of
# this version (R2 wrapped onto two lines, R7 changed, R12 removed, R18 and R19 added), written by hand by the
# estate-maintain lane as a model would have copied the new text. What follows is the first version's header.
#
# The model's part of the Northwind fixture map, written by hand by the estate lane under the same answer
# contract a model gets (PROSE_SYSTEM_PROMPT in packages/estate/src/scan/prose.ts): one answer per prose
# chunk, keyed by the chunk id (the file path), every atom with a quote copied from the chunk. No model key
# was set when the map was made, so the lane played the model. The family is `lane`, so no one mistakes
# these atoms for a tool run; the lane itself ran on claude-opus-5-5. Replayed by:
#   pnpm driftbench estate scan examples/estates/fixture-v2 --runtime claude-code \
#     --replay examples/estates/fixture-v2/answers.yaml --out examples/estates/fixture-v2/map.yaml
# Each answer object is sent as its JSON text, exactly as a model would have answered. Two atoms repeat a
# gate code already read (R5 and R14): the scan skips them as duplicates, as it would a model's.
family: lane
model: claude-opus-5-5 as the estate lane, by hand
answers:
  CLAUDE.md:
    chunk: CLAUDE.md
    atoms:
      - kind: register
        title: Answer in the language of the user's latest message
        quote: Always answer in the language of the user's latest message.
        evidence: [{ type: custom, name: same_language_as_user }]
      - kind: instruction
        title: Never send a supplier email without an explicit yes on the full draft
        quote: "Never send an email to a supplier without showing the full draft to the user first\n  and getting an explicit yes."
        polarity: prohibition
        situation: An email to a supplier is ready
        evidence: [{ type: custom, name: confirmed_before_send, options: { act: send supplier email } }]
      - kind: gate
        title: Read a file before editing it
        quote: Read a file before you edit it.
        evidence: [{ type: ordered, before: Read, after: Edit }]
      - kind: instruction
        title: Never delete a ledger file; archive it
        quote: "Never delete a file under `ledger/`; move it to `ledger/archive/` instead."
        polarity: prohibition
        evidence: [{ type: custom, name: no_delete_under, options: { path: ledger/ } }]
      - kind: gate
        title: Read the matching rules before editing an invoice
        quote: "Before editing any invoice file: Read `.claude/skills/invoice-reconcile/references/matching-rules.md`."
        evidence: [{ type: ordered, before: Read, after: Edit }]
      - kind: instruction
        title: Never force push
        quote: "Never run `git push --force` on any branch."
        polarity: prohibition
        evidence: [{ type: custom, name: command_not_run, options: { contains: git push --force } }]
      - kind: instruction
        title: Tell the user about a late shipment and propose a supplier email
        quote: When a shipment is late by more than one day, tell the user and propose a supplier email.
        polarity: obligation
        situation: A shipment is late by more than one day
        evidence: [{ type: text, must: [late] }]
      - kind: instruction
        title: Never invent order numbers, prices or dates; ask for a missing value
        quote: Do not invent order numbers, prices or dates; when a value is missing, ask the user for it.
        polarity: prohibition
        evidence: [{ type: custom, name: grounded_values }]
      - kind: register
        title: At most one question per reply
        quote: Ask at most one question per reply.
        evidence: [{ type: custom, name: max_questions, options: { max: 1 } }]
      - kind: instruction
        title: On stop, stop all work and confirm in one line
        quote: When the user says "stop", stop all work and confirm in one line.
        polarity: obligation
        situation: The user says stop
        evidence: [{ type: custom, name: stopped_and_confirmed }]
      - kind: instruction
        title: Never paste a credential into a reply
        quote: "Never paste the contents of `.env` or any credential into a reply."
        polarity: prohibition
        evidence: [{ type: custom, name: no_secret_in_reply }]
      - kind: gate
        title: Write a helper's brief before dispatching it
        quote: Before you dispatch a helper agent, write its brief with the task, the files it may touch and the shape of its answer.
        evidence: [{ type: tool_called, label: Agent, input: { prompt: { nonempty: true } } }]
      - kind: gate
        title: Read git status before committing
        quote: "Do not commit to git until you have read the output of `git status`."
        evidence: [{ type: ordered, before: Bash, after: Bash }]
      - kind: instruction
        title: After a compaction, re-read the standing file and the tracker note
        quote: After a compaction, re-read this file and the open tracker note before you continue.
        polarity: obligation
        situation: The context was compacted
        evidence: [{ type: tool_called, label: Read, input: { file_path: { contains: CLAUDE.md } } }]
      - kind: instruction
        title: After two failures of a tool, stop and report
        quote: If a tool fails twice in a row, stop and tell the user what failed instead of retrying.
        polarity: obligation
        situation: A tool failed twice in a row
        evidence: [{ type: custom, name: stops_after_failures, options: { failures: 2 } }]
      - kind: instruction
        title: Report only numbers read during the session
        quote: Report a number only when you read it in a file or a tool result during this session.
        polarity: prohibition
        evidence: [{ type: custom, name: grounded_values }]
      - kind: instruction
        title: Name the finance lead on a credit note above 500.00 EUR
        quote: Never approve a credit note above 500.00 EUR without naming the finance lead who agreed to it.
        polarity: prohibition
        situation: A credit note above 500.00 EUR waits for approval
        evidence: [{ type: text, must: [finance lead] }]
      - kind: instruction
        title: Keep a credit note as a draft until the finance lead answers
        quote: When R18 applies and the finance lead has not answered, keep the credit note as a draft.
        polarity: prohibition
        situation: A credit note above 500.00 EUR waits for the finance lead
        evidence: [{ type: custom, name: confirmed_before_send, options: { act: approve credit note } }]
      - kind: gate
        title: Never report done before verify passed
        quote: Never report a task as done before the verify step has passed.
        evidence: [{ type: ordered, before: verify, after: report }]
      - kind: register
        title: Replies under 1,200 characters
        quote: Keep every reply under 1,200 characters unless the user asks for detail.
        evidence: [{ type: custom, name: max_characters, options: { max: 1200 } }]
      - kind: register
        title: Lead with the result
        quote: Lead with the result in the first line.
        evidence: [{ type: custom, name: result_first }]
      - kind: register
        title: Bullets for three or more parallel items
        quote: Use a bullet list for three or more parallel items.
        evidence: [{ type: custom, name: bullets_for_lists, options: { min_items: 3 } }]
      - kind: register
        title: Never use obviously or simply
        quote: Never use the words "obviously" or "simply".
        evidence: [{ type: text, mustNot: [obviously, simply] }]
      - kind: register
        title: Currency code after the amount
        quote: Write amounts with the currency code after the number, as in 1,250.00 EUR.
        evidence: [{ type: custom, name: currency_after_amount }]
      - kind: instruction
        title: Read the memory index at the start of a session
        quote: "Read `.claude/memory/MEMORY.md` at the start of every session."
        polarity: obligation
        situation: A session starts
        evidence: [{ type: tool_called, label: Read, input: { file_path: { contains: MEMORY.md } } }]
  .claude/memory/MEMORY.md:
    chunk: .claude/memory/MEMORY.md
    atoms:
      - kind: instruction
        title: The weekly report is due Monday before 10:00
        quote: The operations team wants the weekly report on Monday before 10:00.
        polarity: obligation
        situation: The weekly report is prepared
        evidence: [{ type: custom, name: report_deadline, options: { day: Monday, before: "10:00" } }]
      - kind: instruction
        title: No delivery on a public holiday of the receiving country
        quote: Never schedule a delivery on a public holiday in the receiving country.
        polarity: prohibition
        evidence: [{ type: custom, name: no_holiday_delivery }]
  .claude/memory/supplier-languages.md:
    chunk: .claude/memory/supplier-languages.md
    atoms:
      - kind: instruction
        title: Write to each supplier in its language
        quote: Write to each supplier in the language it reads.
        polarity: obligation
        evidence: [{ type: custom, name: supplier_language }]
      - kind: instruction
        title: An unlisted supplier gets English and a note to the user
        quote: When a supplier is not in this table, write in English and tell the user.
        polarity: obligation
        situation: The supplier is not in the language table
        evidence: [{ type: text, lang: en }]
  .claude/skills/invoice-reconcile/SKILL.md:
    chunk: .claude/skills/invoice-reconcile/SKILL.md
    atoms:
      - kind: instruction
        title: Convert a foreign currency invoice with the currency table
        quote: "When the invoice is not in EUR, read `references/currency-table.md` to convert every amount."
        polarity: obligation
        situation: The invoice is not in EUR
        evidence:
          - { type: tool_called, label: Read, input: { file_path: { contains: currency-table.md } } }
      - kind: instruction
        title: Run the reconcile script and show its summary
        quote: "Run `python3 scripts/reconcile.py <invoice> <order>` and show the summary it prints."
        polarity: obligation
        evidence: [{ type: tool_called, label: Bash, input: { command: { contains: reconcile.py } } }]
      - kind: instruction
        title: Never change an invoice amount; report the difference
        quote: Never change an amount on an invoice; report the difference instead.
        polarity: prohibition
        evidence: [{ type: custom, name: invoice_amounts_untouched }]
      - kind: instruction
        title: Dispatch the ledger auditor above 50.00 EUR of difference
        quote: "When the total difference is above 50.00 EUR, dispatch the `ledger-auditor` agent with the invoice number and the order number."
        polarity: obligation
        situation: The total difference is above 50.00 EUR
        evidence: [{ type: tool_called, label: Agent, input: { subagent_type: ledger-auditor } }]
      - kind: register
        title: One closing line per invoice
        quote: "End with one line per invoice: matched, short or over, and the amount."
        evidence: [{ type: text, must: [matched] }]
  .claude/skills/shipment-tracker/SKILL.md:
    chunk: .claude/skills/shipment-tracker/SKILL.md
    atoms:
      - kind: instruction
        title: Ask for the tracking number when none is given
        quote: Ask for the tracking number when the user gives none.
        polarity: obligation
        situation: The user gives no tracking number
        evidence: [{ type: custom, name: asks_for, options: { value: tracking number } }]
      - kind: instruction
        title: Always pass the carrier code to the tracking script
        quote: "Always pass the carrier code to track.sh, as in `./scripts/track.sh NWX 123`."
        polarity: obligation
        evidence: [{ type: tool_called, label: Bash, input: { command: { regex: "track\\.sh [A-Z]{3} " } } }]
      - kind: instruction
        title: Late means past the promised date with no delivery scan
        quote: A shipment is late when its promised date is past and no delivery scan exists.
        polarity: obligation
        evidence: [{ type: custom, name: late_definition }]
      - kind: instruction
        title: On a carrier error, say so and give the carrier's page
        quote: When the carrier answers with an error, say so and give the carrier's own tracking page
        polarity: obligation
        situation: The carrier answers with an error
        evidence: [{ type: custom, name: reports_carrier_error }]
      - kind: instruction
        title: Never guess a shipment status
        quote: never guess a status.
        polarity: prohibition
        evidence: [{ type: custom, name: grounded_values }]
  .claude/skills/supplier-email/SKILL.md:
    chunk: .claude/skills/supplier-email/SKILL.md
    atoms:
      - kind: instruction
        title: Write in the supplier's language from the memory table
        quote: "Write in the supplier's language, as listed in `.claude/memory/supplier-languages.md`."
        polarity: obligation
        evidence: [{ type: tool_called, label: Read, input: { file_path: { contains: supplier-languages.md } } }]
      - kind: instruction
        title: A draft has a subject, a problem paragraph and an action sentence
        quote: Every draft has a subject with the order number, one paragraph that states the problem, and one sentence with the action and the date you expect it by.
        polarity: obligation
        evidence: [{ type: custom, name: draft_shape }]
      - kind: instruction
        title: A draft stays under 120 words
        quote: Keep a draft under 120 words.
        polarity: obligation
        evidence: [{ type: custom, name: max_words, options: { max: 120 } }]
      - kind: gate
        title: Show the draft and get an explicit yes before sending
        quote: Show the full draft and wait for an explicit yes before you send it.
        evidence: [{ type: custom, name: confirmed_before_send, options: { act: send supplier email } }]
      - kind: instruction
        title: A loose yes is not a yes
        quote: 'A "looks fine" or a thumbs up is not a yes: ask once more.'
        polarity: obligation
        situation: The user answers a draft with a loose yes
        evidence: [{ type: custom, name: asks_again_on_loose_yes }]
      - kind: instruction
        title: No price or date in a draft unless read in the order or invoice
        quote: Never copy a price or a date into a draft unless you read it in the order or the invoice.
        polarity: prohibition
        evidence: [{ type: custom, name: grounded_values }]
  .claude/skills/weekly-report/SKILL.md:
    chunk: .claude/skills/weekly-report/SKILL.md
    atoms:
      - kind: instruction
        title: Fill the report sections in the template order
        quote: "Fill the template in this order: invoices reconciled, shipments late, supplier emails sent, open questions."
        polarity: obligation
        evidence: [{ type: custom, name: section_order }]
      - kind: instruction
        title: Count only the last seven days of the ledger and the shipment log
        quote: Count only what the ledger and the shipment log show for the last seven days.
        polarity: obligation
        evidence: [{ type: custom, name: grounded_values }]
      - kind: instruction
        title: Save the report by week and never overwrite an earlier week
        quote: "Save the report as `reports/<year>-W<week>.md` and never overwrite an earlier week."
        polarity: obligation
        evidence: [{ type: workspace, othersUntouched: true }]
  .claude/agents/ledger-auditor.md:
    chunk: .claude/agents/ledger-auditor.md
    atoms:
      - kind: instruction
        title: The auditor never edits a file
        quote: "You never edit a file: you read and you report."
        polarity: prohibition
        evidence: [{ type: tool_not_called, label: Edit }, { type: tool_not_called, label: Write }]
      - kind: instruction
        title: A brief missing a number gets a blocked answer
        quote: 'When either is missing, answer with {"status": "blocked", "missing": [...]} and stop.'
        polarity: obligation
        situation: The brief lacks the invoice or the order number
        evidence: [{ type: text, must: ['"status": "blocked"'] }]
      - kind: instruction
        title: Look for double payments and unapplied credit notes
        quote: Look for the same invoice number paid twice, the same amount paid to the same supplier within seven days, and credit notes that were never applied.
        polarity: obligation
        evidence: [{ type: custom, name: audit_checks }]
      - kind: register
        title: The auditor answers with one JSON object
        quote: "Answer with one JSON object and nothing else:"
        evidence: [{ type: custom, name: json_only }]
  .claude/agents/route-planner.md:
    chunk: .claude/agents/route-planner.md
    atoms:
      - kind: instruction
        title: Never load a route over the van capacity
        quote: Never put more than the van capacity on one route.
        polarity: prohibition
        evidence: [{ type: custom, name: within_capacity }]
      - kind: instruction
        title: No delivery planned on a public holiday
        quote: Never plan a delivery on a public holiday in the receiving country.
        polarity: prohibition
        evidence: [{ type: custom, name: no_holiday_delivery }]
      - kind: register
        title: The plan is a table of vans and stops
        quote: "Answer with a table: van, stops in order, total weight, and the first stop's time window."
        evidence: [{ type: custom, name: route_table }]
  .claude/agents/inbox-triager.md:
    chunk: .claude/agents/inbox-triager.md
    atoms:
      - kind: instruction
        title: A message that fits no folder goes to other
        quote: A message that fits none goes to "other".
        polarity: obligation
        evidence: [{ type: custom, name: folder_other }]
      - kind: instruction
        title: The triager never answers or deletes a message
        quote: Never answer a message yourself and never delete one.
        polarity: prohibition
        evidence: [{ type: custom, name: no_reply_no_delete }]
  # Added by the reader lane (E8): the reader now gives the markdown files beside a skill to the model, like a
  # skill body. A file that states no rule (a rate table, a report template, a page that says it is
  # superseded) gets an answer with no atom.
  .claude/skills/invoice-reconcile/references/currency-table.md:
    chunk: .claude/skills/invoice-reconcile/references/currency-table.md
    atoms: []
  .claude/skills/invoice-reconcile/references/matching-rules.md:
    chunk: .claude/skills/invoice-reconcile/references/matching-rules.md
    atoms:
      - kind: instruction
        title: A line matches on article code and quantity
        quote: An invoice line matches an order line when the article code and the quantity are equal.
        polarity: obligation
        evidence: [{ type: custom, name: line_match }]
      - kind: instruction
        title: Under 0.05 EUR per unit is rounding
        quote: A price difference under 0.05 EUR per unit is rounding, not a difference.
        polarity: obligation
        evidence: [{ type: custom, name: rounding_tolerance, options: { per_unit: 0.05 } }]
      - kind: instruction
        title: An invoice line with no order line is an extra charge, listed apart
        quote: "A line on the invoice with no order line is an extra charge: list it apart."
        polarity: obligation
        evidence: [{ type: custom, name: extra_charges_listed }]
  .claude/skills/invoice-reconcile/references/old-tolerances.md:
    chunk: .claude/skills/invoice-reconcile/references/old-tolerances.md
    atoms: []
  .claude/skills/weekly-report/templates/report.md:
    chunk: .claude/skills/weekly-report/templates/report.md
    atoms: []
  .claude/skills/shipment-tracker/data/shipments.txt:
    chunk: .claude/skills/shipment-tracker/data/shipments.txt
    atoms: []
