            merges: "6216ea97db036ddc9ea85f127646e03bbe1fdc17 c30739587954a1a82a38a3bdc8ea887efa4f5c1e 0a1be9faeee0bc7eae684f8a21d6a320f965b95d 0ef819f15c743cb4e14e31cdefe19da0485f7ac4 67aa80fb96e80ea3ecffcb648dd78ab90c68ec34 5021f12b9d97d829bfd9ed7533ee21620e2adf09 9bba93afbae0b088e1ebf38d45b5c360d207695a aa58402f165fdfbf9e6161445d12b8e58a0b17f6 8d4e11ea850b690b23fcc2c05d7618b2323a9b13 91892cdd803384405a7eb992d9ed879bf6d3fb76"
          - name: "base+639"
            merges: "6216ea97db036ddc9ea85f127646e03bbe1fdc17 c30739587954a1a82a38a3bdc8ea887efa4f5c1e 0a1be9faeee0bc7eae684f8a21d6a320f965b95d 0ef819f15c743cb4e14e31cdefe19da0485f7ac4 67aa80fb96e80ea3ecffcb648dd78ab90c68ec34 5021f12b9d97d829bfd9ed7533ee21620e2adf09 9bba93afbae0b088e1ebf38d45b5c360d207695a aa58402f165fdfbf9e6161445d12b8e58a0b17f6 8d4e11ea850b690b23fcc2c05d7618b2323a9b13 f80f589e1d8aea94c376dea57b6fccc8be2709f5"
          - name: "base+642+632"
            merges: "6216ea97db036ddc9ea85f127646e03bbe1fdc17 c30739587954a1a82a38a3bdc8ea887efa4f5c1e 0a1be9faeee0bc7eae684f8a21d6a320f965b95d 0ef819f15c743cb4e14e31cdefe19da0485f7ac4 67aa80fb96e80ea3ecffcb648dd78ab90c68ec34 5021f12b9d97d829bfd9ed7533ee21620e2adf09 9bba93afbae0b088e1ebf38d45b5c360d207695a aa58402f165fdfbf9e6161445d12b8e58a0b17f6 8d4e11ea850b690b23fcc2c05d7618b2323a9b13 2b3e3318d72a3c9e1e5d668bac773a895d1e0cac e80906e4cff316e817aab9ee06740ff2aefe97e6"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 6943d0147e8745f69277ea46191d59a72b23c3fa
          fetch-depth: 0
      - name: Merge the listed commits onto prose (docs rows and CHANGELOG on the prose side)
        shell: bash
        env:
          MERGES: ${{ matrix.merges }}
        run: |
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'
          for c in $MERGES; do
            if git merge --no-edit "$c"; then echo "merged $c"; continue; fi
            files=$(git diff --name-only --diff-filter=U)
            echo "conflicts in: $files"
            for f in $files; do
              case "$f" in
                docs/*.md|CHANGELOG.md|examples/estates/fixture/generated/*) git checkout --ours -- "$f" || git rm -q -f -- "$f"; git add -- "$f" ;;
                *) echo "::error::code conflict in $f"; exit 1 ;;
              esac
            done
            git commit --no-edit
            echo "merged $c (docs rows and generated files kept on the earlier side)"
          done
          echo "tested $(git rev-parse HEAD)"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm build
      - name: The tests whose cause is not attributed
        shell: bash
        run: |
          status=0
          pnpm exec vitest run --maxWorkers=2 packages/validators/test/estate/ladder.test.ts packages/validators/test/estate/read-when-governed.test.ts packages/cli/test/estate-chain.test.ts 2>&1 | tee "bis-${{ strategy.job-index }}.log" || status=$?
          echo "exit $status" >> "bis-${{ strategy.job-index }}.log"
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bis-${{ strategy.job-index }}
          path: bis-${{ strategy.job-index }}.log

  protect:
    name: executor branches leave the validators alone
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Refuse protected changes from an exec/ branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: pnpm driftbench validate protect --branch "$HEAD_REF" --base "origin/$BASE_REF"
