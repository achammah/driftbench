name: validators

# Runs every registered validator on seeds 1 to 3 and the hidden seed, enforces validators/floors.json,
# checks each validator's HANDOVER.md against its journal, and refuses a pull request from an executor
# branch (exec/...) that changes the validator code, the floors, the executor instruction, the fault family,
# the statistics reference fixtures or this file. Documented in docs/validators.md section 8.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      jobs:
        description: Comma-separated job ids to run on a train/* branch, no spaces (for example build,python). A dispatch on any other branch runs nothing.
        required: true
        type: string
      seeds:
        description: For blocks-measure only. trial runs seeds 1 to 3 and the hidden seed in 3 jobs; one runs seed 1 in 1 job (a planted-bug or cheat check); full runs seeds 1 to 20 and the hidden seed in 10 jobs, for a gate measurement only.
        required: false
        default: trial
        type: choice
        options: [trial, one, full]

permissions:
  contents: read

# Pull requests share one group per ref and a non-train PR cancels its older run. A push to main and a
# dispatch each get a group of their own, so no run on main ever cancels or replaces another.
concurrency:
  group: validators-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'train/') }}

jobs:
  ladders:
    if: github.event_name == 'push' || startsWith(github.head_ref, 'train/') || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/') && contains(format(',{0},', inputs.jobs), ',ladders,'))
    name: ladders and floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Every validator on seeds 1 to 3 and the hidden seed, at or above its floor
        run: pnpm driftbench validate all --seeds 1..3 --hidden --check-floor
      - name: Every handover agrees with its journal
        run: pnpm driftbench validate all --check-handover

  system-full:
    if: github.event_name == 'push' || startsWith(github.head_ref, 'train/') || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/') && contains(format(',{0},', inputs.jobs), ',system-full,'))
    name: system all 11 levels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Every system level on seeds 1 to 3 and the hidden seed
        shell: bash
        run: |
          # --check-floor deliberately caps measurement at the floor (currently 9).
          # A plain full run returns the level reached, so success here is 11, not 0.
          status=0
          if pnpm driftbench validate system --seeds 1..3 --hidden --all-levels; then
            status=0
          else
            status=$?
          fi
          test "$status" -eq 11

  blocks-measure:
    # The blocks bank on seeds 1 to 20 and the hidden seed, in shards, for a journal row (docs/validators.md
    # section 12.4): each shard uploads its --items --json report. The exit code is the level reached, so the
    # step records it and never fails the job on it.
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/') && contains(format(',{0},', inputs.jobs), ',blocks-measure,')
    name: blocks bank seeds ${{ matrix.seeds }}${{ matrix.hidden && ' and hidden' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # Runners are shared: a trial round measures seeds 1 to 3 and the hidden seed in 3 jobs; only a gate
      # measurement (seeds: full) runs the 20-seed sweep in 10 jobs.
      matrix:
        include: ${{ fromJSON(inputs.seeds == 'full' && '[{"seeds":"1..2","hidden":true},{"seeds":"3..4","hidden":false},{"seeds":"5..6","hidden":false},{"seeds":"7..8","hidden":false},{"seeds":"9..10","hidden":false},{"seeds":"11..12","hidden":false},{"seeds":"13..14","hidden":false},{"seeds":"15..16","hidden":false},{"seeds":"17..18","hidden":false},{"seeds":"19..20","hidden":false}]' || inputs.seeds == 'one' && '[{"seeds":"1..1","hidden":false}]' || '[{"seeds":"1..1","hidden":false},{"seeds":"2..2","hidden":false},{"seeds":"3..3","hidden":true}]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Measure the shard
        shell: bash
        env:
          SEEDS: ${{ matrix.seeds }}
          HIDDEN: ${{ matrix.hidden && '--hidden' || '' }}
        run: |
          status=0
          pnpm -s driftbench validate blocks --seeds "$SEEDS" $HIDDEN --items --json > blocks-items.json || status=$?
          echo "level (exit code) $status"
          test -s blocks-items.json
      - uses: actions/upload-artifact@v4
        with:
          name: blocks-items-${{ strategy.job-index }}
          path: blocks-items.json

  protect:
    name: executor branches leave the validators alone
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Refuse protected changes from an exec/ branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: pnpm driftbench validate protect --branch "$HEAD_REF" --base "origin/$BASE_REF"
