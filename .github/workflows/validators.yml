          echo "tested $(git rev-parse HEAD)"
          git log -1 --format='682 fix in tested tree: %H' ; git merge-base --is-ancestor 33e7ae7d4 HEAD && echo "33e7ae7d4 (682) is in the tested tree" || echo "33e7ae7d4 (682) is NOT in the tested tree"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
