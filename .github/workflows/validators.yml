name: validators

# Runs every registered validator on seeds 1 to 3 and the hidden seed, enforces validators/floors.json,
# checks each validator's HANDOVER.md against its journal, and refuses a pull request from an executor
# branch (exec/...) that changes the validator code, the floors, the executor instruction, the fault family,
# the statistics reference fixtures or this file. Documented in docs/validators.md section 8.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      jobs:
        description: Comma-separated job ids to run on a train/* branch, no spaces (for example build,python). A dispatch on any other branch runs nothing.
        required: true
        type: string

permissions:
  contents: read

# Pull requests share one group per ref and a non-train PR cancels its older run. A push to main and a
# dispatch each get a group of their own, so no run on main ever cancels or replaces another.
concurrency:
  group: validators-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'train/') }}

jobs:
  ladders:
    if: github.event_name == 'push' || startsWith(github.head_ref, 'train/') || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/') && contains(format(',{0},', inputs.jobs), ',ladders,'))
    name: ladders and floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Every validator on seeds 1 to 3 and the hidden seed, at or above its floor
        run: pnpm driftbench validate all --seeds 1..3 --hidden --check-floor
      - name: Every handover agrees with its journal
        run: pnpm driftbench validate all --check-handover

  system-full:
    if: github.event_name == 'push' || startsWith(github.head_ref, 'train/') || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/') && contains(format(',{0},', inputs.jobs), ',system-full,'))
    name: system all 11 levels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Every system level on seeds 1 to 3 and the hidden seed
        shell: bash
        run: |
          # --check-floor deliberately caps measurement at the floor (currently 9).
          # A plain full run returns the level reached, so success here is 11, not 0.
          status=0
          if pnpm driftbench validate system --seeds 1..3 --hidden --all-levels; then
            status=0
          else
            status=$?
          fi
          test "$status" -eq 11

  estate-test-608:
    # Measurement only, on train/estate-608-test. Never merged to main.
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/') && contains(format(',{0},', inputs.jobs), ',estate-test-608,')
    name: mutants.test.ts on main plus ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nothing
            merges: ''
          - name: 53b294fd5
            merges: 53b294fd5
          - name: 1f73e772f
            merges: 1f73e772f
          - name: 9de22ec8c
            merges: 9de22ec8c
          - name: 94d59744d
            merges: 94d59744d
          - name: 7d86072da
            merges: 7d86072da
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Merge the commit onto main
        shell: bash
        env:
          MERGES: ${{ matrix.merges }}
        run: |
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          echo "main $(git rev-parse HEAD)"
          for c in $MERGES; do
            if git merge --no-edit "$c"; then
              echo "merged $c"
              continue
            fi
            files=$(git diff --name-only --diff-filter=U)
            echo "conflicts in: $files"
            for f in $files; do
              case "$f" in
                docs/*.md|CHANGELOG.md) git checkout --ours -- "$f"; git add -- "$f" ;;
                *) echo "::error::code conflict in $f"; exit 1 ;;
              esac
            done
            git commit --no-edit
            echo "merged $c (docs rows kept on the main side)"
          done
          echo "tested $(git rev-parse HEAD)"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm build
      - name: The failing test file
        shell: bash
        run: |
          status=0
          pnpm exec vitest run packages/validators/test/estate/mutants.test.ts 2>&1 | tee "mutants-${{ matrix.name }}.log" || status=$?
          echo "exit $status" >> "mutants-${{ matrix.name }}.log"
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-${{ matrix.name }}
          path: mutants-${{ matrix.name }}.log

  protect:
    name: executor branches leave the validators alone
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Refuse protected changes from an exec/ branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: pnpm driftbench validate protect --branch "$HEAD_REF" --base "origin/$BASE_REF"
