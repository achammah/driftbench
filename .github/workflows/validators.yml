name: validators

# Runs every registered validator on seeds 1 to 3 and the hidden seed, enforces validators/floors.json,
# checks each validator's HANDOVER.md against its journal, and refuses a pull request from an executor
# branch (exec/...) that changes the validator code, the floors, the executor instruction, the fault family,
# the statistics reference fixtures or this file. Documented in docs/validators.md section 8.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      jobs:
        description: Comma-separated job ids to run on a train/* branch, no spaces (for example build,python). A dispatch on any other branch runs nothing.
        required: true
        type: string

permissions:
  contents: read

# Pull requests share one group per ref and a non-train PR cancels its older run. A push to main and a
# dispatch each get a group of their own, so no run on main ever cancels or replaces another.
concurrency:
  group: validators-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'train/') }}

jobs:
  ladders:
    if: github.event_name == 'push' || startsWith(github.head_ref, 'train/') || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/') && contains(format(',{0},', inputs.jobs), ',ladders,'))
    name: ladders and floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Every validator on seeds 1 to 3 and the hidden seed, at or above its floor
        run: pnpm driftbench validate all --seeds 1..3 --hidden --check-floor
      - name: Every handover agrees with its journal
        run: pnpm driftbench validate all --check-handover

  system-full:
    if: github.event_name == 'push' || startsWith(github.head_ref, 'train/') || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/') && contains(format(',{0},', inputs.jobs), ',system-full,'))
    name: system all 11 levels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Every system level on seeds 1 to 3 and the hidden seed
        shell: bash
        run: |
          # --check-floor deliberately caps measurement at the floor (currently 9).
          # A plain full run returns the level reached, so success here is 11, not 0.
          status=0
          if pnpm driftbench validate system --seeds 1..3 --hidden --all-levels; then
            status=0
          else
            status=$?
          fi
          test "$status" -eq 11

  estate-full:
    # Measurement only, on train/estate-union. Never merged to main.
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/') && contains(format(',{0},', inputs.jobs), ',estate-full,')
    name: estate all levels (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: seed1-hidden
            args: --seed 1 --hidden
          - name: seed2
            args: --seed 2
          - name: seed3
            args: --seed 3
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Estate ladder, every level
        shell: bash
        env:
          RUN_ARGS: ${{ matrix.args }}
          RUN_NAME: ${{ matrix.name }}
        run: |
          # The exit code is the level reached, not a pass or fail: keep it beside the json.
          start=$(date +%s)
          status=0
          # shellcheck disable=SC2086
          pnpm -s driftbench validate estate $RUN_ARGS --all-levels --json > "estate-$RUN_NAME.json" || status=$?
          echo "{\"exit\": $status, \"seconds\": $(( $(date +%s) - start )), \"head\": \"$(git rev-parse HEAD)\"}" > "estate-$RUN_NAME.meta.json"
          cat "estate-$RUN_NAME.meta.json"
      - name: Keep the run as evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estate-${{ matrix.name }}
          path: |
            estate-${{ matrix.name }}.json
            estate-${{ matrix.name }}.meta.json

  estate-gen-check:
    # Measurement only, on train/estate-union*. Never merged to main. Regenerates the committed fixture suite with
    # the recipe's generate command and reports what differs from the committed tree.
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/') && contains(format(',{0},', inputs.jobs), ',estate-gen-check,')
    name: fresh generate against the committed suite (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pr640
            ref: 6cd0ef478ea9d96fabaf290df6472a8222e10ef1
          - name: union
            ref: ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Generate the suite again and compare it with the committed one
        shell: bash
        run: |
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          echo "tested $(git rev-parse HEAD)" > "gen-check-${{ matrix.name }}.txt"
          rm -rf examples/estates/fixture/generated
          status=0
          pnpm -s driftbench estate generate --map examples/estates/fixture/approved.yaml --plan packages/generate/test/estate/fixtures/planner-plan.approved.yaml --out examples/estates/fixture/generated > gen.out 2>&1 || status=$?
          echo "generate exit $status (1 is normal: incomplete specs)" >> "gen-check-${{ matrix.name }}.txt"
          tail -5 gen.out >> "gen-check-${{ matrix.name }}.txt"
          git add -A examples/estates/fixture/generated
          changed=$(git diff --cached --name-status -- examples/estates/fixture/generated | wc -l | tr -d ' ')
          echo "files that differ from the committed tree: $changed" >> "gen-check-${{ matrix.name }}.txt"
          git diff --cached --name-status -- examples/estates/fixture/generated | head -40 >> "gen-check-${{ matrix.name }}.txt"
          echo "--- estate-generate-report.json" >> "gen-check-${{ matrix.name }}.txt"
          git diff --cached -- examples/estates/fixture/generated/estate-generate-report.json | head -60 >> "gen-check-${{ matrix.name }}.txt"
          cat "gen-check-${{ matrix.name }}.txt"
      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gen-check-${{ matrix.name }}
          path: gen-check-${{ matrix.name }}.txt

  estate-regen:
    # Measurement only, on train/estate-union*. Never merged to main. Runs the documented generate step of the recipe
    # (estate generate on fixture/approved.yaml and planner-plan.approved.yaml, seed 1, output folder emptied first)
    # and keeps the resulting tree as an artifact; it changes nothing in the repository.
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/') && contains(format(',{0},', inputs.jobs), ',estate-regen,')
    name: estate generate (recipe step 5) for the committed suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Generate
        shell: bash
        run: |
          rm -rf examples/estates/fixture/generated
          status=0
          pnpm -s driftbench estate generate --map examples/estates/fixture/approved.yaml --plan packages/generate/test/estate/fixtures/planner-plan.approved.yaml --out examples/estates/fixture/generated > gen.out 2>&1 || status=$?
          echo "generate exit $status (1 is normal)"; tail -8 gen.out
          tar -czf generated.tgz -C examples/estates/fixture generated
          cp examples/estates/fixture/generated/estate-generate-report.json report.json
      - uses: actions/upload-artifact@v4
        with:
          name: regenerated-tree
          path: |
            generated.tgz
            report.json
            gen.out

  full-suite:
    # Measurement only. Every test of the repository (vitest run), in shards, on the tested branch.
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/') && contains(format(',{0},', inputs.jobs), ',full-suite,')
    name: full suite shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm build
      - name: vitest shard
        shell: bash
        run: |
          status=0
          pnpm exec vitest run --maxWorkers=2 --shard=${{ matrix.shard }}/4 2>&1 | tee "suite-${{ matrix.shard }}.log" || status=$?
          echo "exit $status" >> "suite-${{ matrix.shard }}.log"
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-${{ matrix.shard }}
          path: suite-${{ matrix.shard }}.log

  protect:
    name: executor branches leave the validators alone
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Refuse protected changes from an exec/ branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: pnpm driftbench validate protect --branch "$HEAD_REF" --base "origin/$BASE_REF"
