name: validators

# Runs every registered validator on seeds 1 to 3 and the hidden seed, enforces validators/floors.json,
# checks each validator's HANDOVER.md against its journal, and refuses a pull request from an executor
# branch (exec/...) that changes the validator code, the floors, the executor instruction, the fault family,
# the statistics reference fixtures or this file. Documented in docs/validators.md section 8.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      jobs:
        description: Comma-separated job ids to run on a train/* branch, no spaces (for example build,python). A dispatch on any other branch runs nothing.
        required: true
        type: string

permissions:
  contents: read

# Pull requests share one group per ref and a non-train PR cancels its older run. A push to main and a
# dispatch each get a group of their own, so no run on main ever cancels or replaces another.
concurrency:
  group: validators-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'train/') }}

jobs:
  ladders:
    if: github.event_name == 'push' || startsWith(github.head_ref, 'train/') || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/') && contains(format(',{0},', inputs.jobs), ',ladders,'))
    name: ladders and floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Every validator on seeds 1 to 3 and the hidden seed, at or above its floor
        run: pnpm driftbench validate all --seeds 1..3 --hidden --check-floor
      - name: Every handover agrees with its journal
        run: pnpm driftbench validate all --check-handover

  system-full:
    if: github.event_name == 'push' || startsWith(github.head_ref, 'train/') || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/') && contains(format(',{0},', inputs.jobs), ',system-full,'))
    name: system all 11 levels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Every system level on seeds 1 to 3 and the hidden seed
        shell: bash
        run: |
          # --check-floor deliberately caps measurement at the floor (currently 9).
          # A plain full run returns the level reached, so success here is 11, not 0.
          status=0
          if pnpm driftbench validate system --seeds 1..3 --hidden --all-levels; then
            status=0
          else
            status=$?
          fi
          test "$status" -eq 11

  estate-tests-509:
    # Measurement only, on train/estate-509-tests. Never merged to main.
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/') && contains(format(',{0},', inputs.jobs), ',estate-tests-509,')
    name: validators tests on the 509 head (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base
            merges: ''
          - name: p684
            merges: fix/estate-level3-pruned-space
          - name: p695
            merges: fix/estate-509-owner-routes
          - name: p608
            merges: fix/estate-fake-agent-grammar-2
          - name: all3
            merges: fix/estate-level3-pruned-space fix/estate-509-owner-routes fix/estate-fake-agent-grammar-2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 750c30f5888a2db5d3e15f1f269b0e76705c5c54
          fetch-depth: 0
      - name: Merge the listed PR heads onto the 509 head
        shell: bash
        env:
          MERGES: ${{ matrix.merges }}
        run: |
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          echo "base $(git rev-parse HEAD)"
          for b in $MERGES; do
            git fetch origin "$b"
            head=$(git rev-parse FETCH_HEAD)
            if git merge --no-edit FETCH_HEAD; then
              echo "merged $b $head"
              continue
            fi
            files=$(git diff --name-only --diff-filter=U)
            echo "conflicts in: $files"
            for f in $files; do
              case "$f" in
                docs/*.md|CHANGELOG.md) git checkout --ours -- "$f"; git add -- "$f" ;;
                *) echo "::error::code conflict in $f"; exit 1 ;;
              esac
            done
            git commit --no-edit
            echo "merged $b $head (docs rows kept on the 509 side)"
          done
          echo "tested $(git rev-parse HEAD)"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm build
      - name: The three test files that fail on the 509 head
        shell: bash
        run: |
          status=0
          pnpm exec vitest run packages/validators/test/estate/emission-mutations.test.ts packages/validators/test/estate/rulings.test.ts packages/validators/test/estate/ladder.test.ts 2>&1 | tee "tests-${{ matrix.name }}.log" || status=$?
          echo "exit $status" >> "tests-${{ matrix.name }}.log"
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.name }}
          path: tests-${{ matrix.name }}.log

  validators-tests-union:
    # Measurement only, on train/estate-509-tests. Never merged to main.
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/') && contains(format(',{0},', inputs.jobs), ',validators-tests-union,')
    name: all validators tests on 509 plus ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 684+608+548fix
            merges: fix/estate-level3-pruned-space fix/estate-fake-agent-grammar-2 fix/estate-missing-reference-contract
          - name: 684+608+548fix+649
            merges: fix/estate-level3-pruned-space fix/estate-fake-agent-grammar-2 fix/estate-missing-reference-contract fix/estate-fixture-phrases
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 750c30f5888a2db5d3e15f1f269b0e76705c5c54
          fetch-depth: 0
      - name: Merge the listed PR heads onto the 509 head
        shell: bash
        env:
          MERGES: ${{ matrix.merges }}
        run: |
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          echo "base $(git rev-parse HEAD)"
          for b in $MERGES; do
            git fetch origin "$b"
            head=$(git rev-parse FETCH_HEAD)
            if git merge --no-edit FETCH_HEAD; then
              echo "merged $b $head"
              continue
            fi
            files=$(git diff --name-only --diff-filter=U)
            echo "conflicts in: $files"
            for f in $files; do
              case "$f" in
                docs/*.md|CHANGELOG.md) git checkout --ours -- "$f"; git add -- "$f" ;;
                *) echo "::error::code conflict in $f"; exit 1 ;;
              esac
            done
            git commit --no-edit
            echo "merged $b $head (docs rows kept on the 509 side)"
          done
          echo "tested $(git rev-parse HEAD)"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm build
      - name: Every test of the validators package
        shell: bash
        run: |
          status=0
          pnpm exec vitest run packages/validators 2>&1 | tee "vtests-${{ strategy.job-index }}.log" || status=$?
          echo "exit $status" >> "vtests-${{ strategy.job-index }}.log"
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vtests-${{ strategy.job-index }}
          path: vtests-${{ strategy.job-index }}.log

  epipe-check:
    # Measurement only, on train/estate-509-tests. Never merged to main.
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/') && contains(format(',{0},', inputs.jobs), ',epipe-check,')
    name: generator.test.ts on the 509 head alone (${{ matrix.rep }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rep: [one, two, three]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 750c30f5888a2db5d3e15f1f269b0e76705c5c54
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm build
      - name: The test that showed EPIPE, alone, then with its neighbours
        shell: bash
        run: |
          status=0
          pnpm exec vitest run packages/validators/test/estate/generator.test.ts 2>&1 | tee "epipe-${{ matrix.rep }}.log" || status=$?
          echo "exit alone $status" >> "epipe-${{ matrix.rep }}.log"
          status=0
          pnpm exec vitest run packages/validators/test/estate 2>&1 | tee -a "epipe-${{ matrix.rep }}.log" | tail -30 || status=$?
          echo "exit estate dir $status" >> "epipe-${{ matrix.rep }}.log"
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epipe-${{ matrix.rep }}
          path: epipe-${{ matrix.rep }}.log

  epipe-main:
    # Measurement only, on train/estate-509-tests. Never merged to main.
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/') && contains(format(',{0},', inputs.jobs), ',epipe-main,')
    name: estate test directory on 509 plus main (${{ matrix.rep }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rep: [one, two, three]
        merge_main: ['yes']
        ref: ['750c30f5888a2db5d3e15f1f269b0e76705c5c54']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - name: Merge main onto the ref (docs rows and CHANGELOG on the ref side)
        shell: bash
        run: |
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git fetch origin main
          echo "main $(git rev-parse FETCH_HEAD)"
          echo "ref  $(git rev-parse HEAD)"
          if [ -n "${{ matrix.merge_main }}" ]; then
            if ! git merge --no-edit FETCH_HEAD; then
              files=$(git diff --name-only --diff-filter=U)
              echo "conflicts in: $files"
              for f in $files; do
                case "$f" in
                  docs/*.md|CHANGELOG.md) git checkout --ours -- "$f"; git add -- "$f" ;;
                  *) echo "::error::code conflict in $f"; exit 1 ;;
                esac
              done
              git commit --no-edit
            fi
          fi
          echo "tested $(git rev-parse HEAD)"
          git log -1 --format='682 fix in tested tree: %H' ; git merge-base --is-ancestor 33e7ae7d4 HEAD && echo "33e7ae7d4 (682) is in the tested tree" || echo "33e7ae7d4 (682) is NOT in the tested tree"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm build
      - name: The whole estate test directory
        shell: bash
        run: |
          status=0
          pnpm exec vitest run packages/validators/test/estate 2>&1 | tee "epipemain-${{ matrix.rep }}.log" || status=$?
          echo "exit $status" >> "epipemain-${{ matrix.rep }}.log"
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epipemain-${{ matrix.rep }}
          path: epipemain-${{ matrix.rep }}.log

  named-tests:
    # Measurement only. estate-chain.test.ts and the system stale tests, on a ref with main merged.
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/') && contains(format(',{0},', inputs.jobs), ',named-tests,')
