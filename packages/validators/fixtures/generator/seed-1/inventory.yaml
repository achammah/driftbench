# The hidden-1 behaviour inventory, drawn by the generator validator. Fictional.
channels: [web, messaging]

behaviours:
  - id: B-001
    title: Report a failed tool honestly, invent none of its answer, and offer a fallback
  - id: B-002
    title: Answer an off-topic question in one line and resume the pending step
  - id: B-003
    title: Save the record as a file in the exports folder when asked
    channels: [web]
  - id: B-004
    title: Treat a loose yes as no confirmation and ask for CONFIRM again
  - id: B-005
    title: Look up the record with lookup_record before stating its status
  - id: B-006
    title: Submit the request with submit_request only after an explicit CONFIRM

flows:
  - id: new-request
    title: A user opens a new request and submits it
    behaviours: [B-001, B-002, B-004, B-005]
    deviations: [D1_off_topic, D3_contradiction, D7_silence_or_burst, D8_tool_failure, D10_return]
  - id: change-request
    title: A user changes a request before it is submitted
    behaviours: [B-001, B-003, B-005]
    deviations: [D2_goal_shift, D4_loose_confirmation]
  - id: status-check
    title: A user asks for the status of a record
    behaviours: [B-003, B-005, B-006]
    deviations: [D3_contradiction, D4_loose_confirmation, D5_language_switch, D6_instruction_in_data, D8_tool_failure, D9_out_of_scope]
