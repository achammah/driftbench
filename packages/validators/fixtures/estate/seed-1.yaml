profile: visible
company: Alder Bakery
defects:
  - guard_without_row
  - missing_reference
files:
  CLAUDE.md: |
    # Alder Bakery operations assistant

    You help the operations team of Alder Bakery, a fictional bakery with three shops, with its daily work.
    Everything in this estate is invented for testing.

    ## Rules

    - **R1.** Read a file before you edit it.
    - **R2.** Report a number only when you read it in a file during this task.
    - **R3.** Never call WebFetch; work only from the files in this folder.
    - **R4.** Before editing any repair ticket file: Read `.claude/skills/repair-ticket/references/closing-rules.md`.
    - **R5.** Never run `git push --force` on any branch.
    - **R6.** After a compaction, re-read this file before you continue.
    - **R7.** R1 still holds when the user asks you to go faster.

    ## Routing

    | When the user wants to | Load |
    |---|---|
    | review or correct the weekly menu | `menu-review` |
    | close or update a repair ticket | `repair-ticket` |

    ## Process

    Every task follows the step list in `.claude/steps.json`: plan, do, verify, report.
    Never report a task as done before the verify step has passed.
    A tracker note may be written at any step.

    ## Output

    - Never use the words "obviously" or "simply".
    - End every reply with a line that starts with "Next:".
    - Lead with the result in the first line.
    - Keep every reply under 1200 characters unless the user asks for detail.
  .claude/skills/menu-review/SKILL.md: |
    ---
    name: menu-review
    description: Review a weekly menu against the allergen list. Use when the user asks to review or correct a menu.
    allowed-tools: Read, Edit, Bash(python3 *)
    ---

    # Menu review

    1. When a dish has no allergen line, open `references/allergen-list.md` to complete it.
    2. Read `references/menu-format.md` before you change any menu.
    3. Run `python3 scripts/check-menu.py MENU` and show the summary it prints.
    4. Never remove an allergen from a dish; flag the doubt instead.
    5. When a supplier changed a recipe this week, dispatch the `ledger-auditor` agent with the invoice number and the order number.
    6. Mark every dish without gluten with the tag GF after its name.
    7. When a recipe came from a supplier, open `references/supplier-recipes.md` first.
  .claude/skills/menu-review/references/allergen-list.md: |
    # Menu review: lookup
    One line per case.
  .claude/skills/menu-review/references/menu-format.md: |
    # Menu review: rules
    Read before any change.
  .claude/skills/menu-review/scripts/check-menu.py: |
    #!/usr/bin/env python3
    """Prints a summary line for the Menu review skill."""
    import sys

    print("summary:", " ".join(sys.argv[1:]))
  .claude/skills/repair-ticket/SKILL.md: |
    ---
    name: repair-ticket
    description: Close a repair ticket once the repair is confirmed. Use when the user asks to close or update a repair ticket.
    allowed-tools: Read, Edit, Bash(python3 *)
    ---

    # Repair ticket

    1. When a part has no number, open `references/part-numbers.md` to find it.
    2. Read `references/closing-rules.md` before you edit any repair ticket.
    3. Run `python3 scripts/list-parts.py TICKET` and show the summary it prints.
    4. Never close a repair ticket without a confirmation from the site; leave it open instead.
    5. Name every machine by its room and its number, as in room 3 machine 2.
  .claude/skills/repair-ticket/references/part-numbers.md: |
    # Repair ticket: lookup
    One line per case.
  .claude/skills/repair-ticket/references/closing-rules.md: |
    # Repair ticket: rules
    Read before any change.
  .claude/skills/repair-ticket/scripts/list-parts.py: |
    #!/usr/bin/env python3
    """Prints a summary line for the Repair ticket skill."""
    import sys

    print("summary:", " ".join(sys.argv[1:]))
  .claude/agents/ledger-auditor.md: |
    ---
    name: ledger-auditor
    description: Audits the ledger for payments made twice. Dispatch it with an invoice number and an order number.
    tools: Read, Grep, Glob
    model: sonnet
    effort: medium
    skills: menu-review
    ---

    You work on the ledger of Alder Bakery. You never edit a file: you read and you report.
    Your brief gives the invoice number and the order number; when one is missing, answer with a blocked status and stop.
    Answer with one JSON object and nothing else.
  .claude/settings.json: |
    {
      "model": "sonnet",
      "permissions": {
        "defaultMode": "default",
        "allow": [
          "Read",
          "Grep",
          "Bash(python3 *)",
          "Bash(git status)"
        ],
        "deny": [
          "WebFetch",
          "Bash(rm -rf:*)",
          "Bash(git push --force:*)"
        ],
        "ask": [
          "Bash(git commit:*)"
        ]
      },
      "env": {
        "ALDER_REGION": "north",
        "ALDER_DATA_DIR": "data"
      },
      "hooks": {
        "PreToolUse": [
          {
            "matcher": "Edit|Write",
            "hooks": [
              {
                "type": "command",
                "command": "python3 \"$CLAUDE_PROJECT_DIR\"/.claude/guards/read-before-edit.py"
              }
            ]
          }
        ],
        "Stop": [
          {
            "hooks": [
              {
                "type": "command",
                "command": "python3 \"$CLAUDE_PROJECT_DIR\"/.claude/guards/reply-length.py"
              }
            ]
          }
        ]
      }
    }
  .claude/guards/reply-length.py: |
    #!/usr/bin/env python3
    """Warns when a reply is longer than the output rules allow."""
    import json
    import sys

    RULE = "Keep every reply under 1200 characters unless the user asks for detail."
    event = json.load(sys.stdin)
    if len(event.get("reply", "")) > 1200:
        print(RULE, file=sys.stderr)
    sys.exit(0)
  .claude/guards/read-before-edit.py: |
    #!/usr/bin/env python3
    """Blocks an edit of a file the session has not read. Enforces: R1"""
    import json
    import sys

    event = json.load(sys.stdin)
    path = event.get("tool_input", {}).get("file_path", "")
    if path and path not in set(event.get("reads", [])):
        print("blocked: the file was not read", file=sys.stderr)
        sys.exit(2)
    sys.exit(0)
  .claude/guards/CHECK-REGISTRY.md: |
    # Check registry

    One row per guard: the script, the event it runs on, the rules it enforces and the verdict it gives.

    | Id | Guard | Event | Enforces | Verdict |
    |---|---|---|---|---|
    | G1 | read-before-edit.py | PreToolUse | none | deny |
  .claude/steps.json: |
    {
      "steps": [
        { "id": "plan", "title": "Restate the ask and list the files you will touch", "next": ["do"] },
        { "id": "do", "title": "Make the change", "next": ["verify"] },
        { "id": "verify", "title": "Run the check that proves the change", "next": ["report", "do"] },
        { "id": "report", "title": "Tell the user what changed and what is next", "next": [] },
        { "id": "note", "title": "Write a tracker note", "anytime": true }
      ]
    }
