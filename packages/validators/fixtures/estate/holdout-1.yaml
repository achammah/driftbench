    ---
    name: invoice-check
    description: Check a supplier invoice against its purchase order. Use when the user asks to check or match an invoice.
    allowed-tools: Read, Edit, Bash(python3 *), Grep
    ---

    # Invoice check

    1. When the invoice is not in euros, open `references/currency-table.md` to convert each amount.
    2. Read `references/matching-rules.md` before you change any invoice.
    3. Run `python3 scripts/match-lines.py INVOICE ORDER` and show the summary it prints.
    4. Never change an amount on an invoice; report the difference instead.
    5. Write every amount with the currency code after the number, as in 12.00 EUR.
