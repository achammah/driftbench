  .claude/settings.json: |
    {
      "model": "opus",
      "permissions": {
        "defaultMode": "acceptEdits",
        "allow": [
          "Read",
          "Grep",
          "Bash(python3 *)"
        ],
        "deny": [
          "WebFetch",
          "Bash(rm -rf:*)"
        ],
        "ask": []
      },
      "env": {
        "ALDER_REGION": "north",
        "ALDER_DATA_DIR": "data"
      },
      "hooks": {
        "PreToolUse": [
          {
            "matcher": "Bash",
            "hooks": [
              {
                "type": "command",
                "command": "\"$CLAUDE_PROJECT_DIR\"/.claude/guards/block-force-push.sh"
              }
            ]
          },
          {
            "matcher": "Edit|Write",
            "hooks": [
              {
                "type": "command",
                "command": "python3 \"$CLAUDE_PROJECT_DIR\"/.claude/guards/read-before-edit.py"
              }
            ]
          }
        ],
        "UserPromptSubmit": [
          {
            "hooks": [
              {
                "type": "command",
                "command": "\"$CLAUDE_PROJECT_DIR\"/.claude/guards/stop-word.sh"
              }
            ]
          }
        ],
        "Stop": [
          {
            "hooks": [
              {
                "type": "command",
                "command": "python3 \"$CLAUDE_PROJECT_DIR\"/.claude/guards/reply-length.py"
              }
            ]
          }
        ]
      }
    }
  .claude/guards/stop-word.sh: |
    #!/bin/sh
    # Answers the stop word with a nudge, in any letter case.
    input=$(cat)
    case "$input" in
      *[Ss][Tt][Oo][Pp]*) echo "the user asked to stop" >&2 ;;
    esac
    exit 0
  .claude/guards/reply-length.py: |
    #!/usr/bin/env python3
    """Warns when a reply is longer than the output rules allow."""
    import json
    import sys

    RULE = "Keep every reply under 1200 characters unless the user asks for detail."
    event = json.load(sys.stdin)
    if len(event.get("reply", "")) > 1200:
        print(RULE, file=sys.stderr)
    sys.exit(0)
  .claude/guards/block-force-push.sh: |
    #!/bin/sh
    # Blocks a forced push on any branch.
    input=$(cat)
    case "$input" in
      *"push --force"*) echo "blocked: forced push" >&2; exit 2 ;;
    esac
    exit 0
  .claude/guards/read-before-edit.py: |
    #!/usr/bin/env python3
    """Blocks an edit of a file the session has not read. Enforces: R7"""
    import json
    import sys

    event = json.load(sys.stdin)
    path = event.get("tool_input", {}).get("file_path", "")
    if path and path not in set(event.get("reads", [])):
        print("blocked: the file was not read", file=sys.stderr)
        sys.exit(2)
    sys.exit(0)
  .claude/guards/check-registry.json: |
    {
      "checks": [
        {"id":"G1","guard":"stop-word.sh","event":"UserPromptSubmit","enforces":["stop all work and confirm in one line"],"verdict":"nudge"},
        {"id":"G2","guard":"reply-length.py","event":"Stop","enforces":[],"verdict":"warn"},
        {"id":"G3","guard":"block-force-push.sh","event":"PreToolUse","enforces":["R4"],"verdict":"deny"},
        {"id":"G4","guard":"check-format.sh","event":"PreToolUse","enforces":[],"verdict":"deny"}
      ]
    }
  .claude/steps.json: |
    {
      "steps": [
        { "id": "plan", "title": "Restate the ask and list the files you will touch", "next": ["do"] },
        { "id": "do", "title": "Make the change", "next": ["verify"] },
        { "id": "verify", "title": "Run the check that proves the change", "next": ["review", "do"] },
        { "id": "review", "title": "Read the change once more", "next": ["report"] },
        { "id": "report", "title": "Tell the user what changed and what is next", "next": [] },
        { "id": "note", "title": "Write a tracker note", "anytime": true }
      ]
    }
